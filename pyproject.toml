[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filmneg"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "rawpy",
    "tifffile",
    "pillow",
    "piexif",
    "exifread",
]

[project.optional-dependencies]
gui = ["PySide6"]
dev = ["pytest", "ruff"]
build = ["pyinstaller"]

[tool.setuptools.packages.find]
where = ["src"]
